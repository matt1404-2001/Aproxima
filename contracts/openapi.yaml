      example:
        partidaId: 42
        codigo: X7K4P
        estado: LOBBY
        versionEstado: 4
        servidorAhora: '2026-10-03T16:01:00Z'
        rol: ANFITRION
        pollingSugeridoMs: 2000
        lobby:
          cantidadJugadores: 2
